<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Upload Multiple Images</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">ระบบจัดการ Slideshow</h2>
        <p class="text-sm text-gray-500 text-center mb-6">สามารถเลือกอัปโหลดพร้อมกันได้มากกว่า 1 รูป</p>
        
        <form id="uploadForm" class="space-y-4">
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:bg-gray-50 transition">
                <input type="file" id="fileInput" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" multiple required>
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 transition duration-300 shadow-md">
                เริ่มอัปโหลดเข้าสู่ระบบ
            </button>
        </form>
    </div>

    <script>
        // SCRIPT_URL ล่าสุดของคุณ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzg1slFWJbXcdWV6VuQHd4nj5khVvjPWpqXC920AdoUa3GQC7-uAvkUDcmPeNpdhnvp/exec';

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return;
            
            const files = fileInput.files;
            const totalFiles = files.length;
            const btn = document.getElementById('submitBtn');
            
            btn.disabled = true;
            
            Swal.fire({
                title: 'กำลังอัปโหลดรูปภาพ...',
                html: `กำลังประมวลผลไฟล์ (0/${totalFiles})`,
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            let successCount = 0;
            let failCount = 0;

            for (let i = 0; i < totalFiles; i++) {
                const file = files[i];
                Swal.getHtmlContainer().innerText = `กำลังส่งรูปที่ ${i + 1}/${totalFiles}: ${file.name}`;
                
                try {
                    const base64Data = await fileToBase64(file);
                    const payload = {
                        filename: file.name,
                        mimeType: file.type,
                        base64: base64Data
                    };

                    // ส่งแบบโหมดหลบเลี่ยง CORS (no-cors)
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', 
                        headers: {
                            'Content-Type': 'text/plain'
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    // เนื่องจากเป็น no-cors เบราว์เซอร์จะส่งข้อมูลสำเร็จโดยไม่ต้องรออ่านค่ากลับ
                    successCount++;
                } catch (error) {
                    console.error("Upload error:", error);
                    failCount++;
                }
            }

            btn.disabled = false;
            
            if (failCount === 0) {
                Swal.fire({
                    icon: 'success',
                    title: 'อัปโหลดสำเร็จทั้งหมด!',
                    text: `เพิ่มรูปภาพจำนวน ${successCount} รูปเข้าสู่สไลด์แล้ว`,
                    confirmButtonColor: '#2563eb'
                });
                document.getElementById('uploadForm').reset();
            } else {
                Swal.fire({
                    icon: 'warning',
                    title: 'ดำเนินการเสร็จสิ้น',
                    text: `สำเร็จ ${successCount} รูป / ล้มเหลว ${failCount} รูป (กรุณาเช็กอินเทอร์เน็ต)`,
                    confirmButtonColor: '#2563eb'
                });
            }
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
