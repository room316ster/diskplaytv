<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Upload Image</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">ระบบอัปโหลดรูปภาพ</h2>
        
        <form id="uploadForm" class="space-y-4">
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:bg-gray-50 transition">
                <input type="file" id="fileInput" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" required>
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 transition duration-300 shadow-md">
                อัปโหลดเข้าสู่ Slideshow
            </button>
        </form>
    </div>

    <script>
        // *** นำ Web App URL ของ Apps Script มาใส่ตรงนี้ ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFe07XLlHPDIWFQGPO32TLsP3WLq8YA1qECyey3SuDU3mnKf2Y6I4beDCrQc1ON1bH/exec';

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return;
            
            const file = fileInput.files[0];
            const btn = document.getElementById('submitBtn');
            
            // แสดงสถานะโหลด
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg> กำลังอัปโหลด...`;

            // อ่านไฟล์เป็น Base64
            const reader = new FileReader();
            reader.onload = async function() {
                const base64Data = reader.result.split(',')[1];
                
                const payload = {
                    filename: file.name,
                    mimeType: file.type,
                    base64: base64Data
                };

                try {
                    // ใช้ text/plain ส่ง payload เพื่อหลีกเลี่ยงปัญหา CORS preflight
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    
                    if(result.status === 'success') {
                        Swal.fire({
                            icon: 'success',
                            title: 'อัปโหลดสำเร็จ!',
                            text: 'รูปภาพถูกเพิ่มเข้าไปในระบบสไลด์แล้ว',
                            confirmButtonColor: '#2563eb'
                        });
                        document.getElementById('uploadForm').reset();
                    } else {
                        throw new Error(result.message);
                    }
                } catch (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'เกิดข้อผิดพลาด',
                        text: 'ไม่สามารถอัปโหลดรูปภาพได้ กรุณาลองใหม่',
                        confirmButtonColor: '#dc2626'
                    });
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = 'อัปโหลดเข้าสู่ Slideshow';
                }
            };
            
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
