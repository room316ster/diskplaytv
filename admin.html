<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Slideshow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <link rel="icon" href="data:,">
    <style>
        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: #2563eb !important; color: white !important; border: none; border-radius: 6px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <div id="loginSection" class="flex items-center justify-center min-h-screen">
        <div class="bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">เข้าสู่ระบบ Admin</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <div id="adminSection" class="hidden max-w-6xl mx-auto p-4 py-8">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
            <h2 class="text-3xl font-bold text-gray-800">ระบบจัดการ Slideshow</h2>
            <button onclick="logout(false)" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition shadow">ออกจากระบบ</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="bg-white rounded-xl shadow p-6">
                <h3 class="text-xl font-semibold mb-4 text-gray-700 border-b pb-2">อัปโหลดรูปภาพใหม่</h3>
                <form id="uploadForm" class="space-y-4 mt-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">เลือกหน้าจอที่จะแสดงผล</label>
                        <select id="uploadTarget" class="w-full px-4 py-2 border rounded-lg focus:ring-blue-500 bg-gray-50">
                            <option value="right">▶️ รูปฝั่งขวา (สลับเป็นสไลด์โชว์)</option>
                            <option value="left">⏹️ รูปฝั่งซ้าย (ภาพนิ่ง)</option>
                        </select>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border" multiple required>
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700 transition shadow">เริ่มอัปโหลดรูป</button>
                </form>
            </div>

            <div class="bg-white rounded-xl shadow p-6 border-t-4 border-yellow-400">
                <h3 class="text-xl font-semibold mb-4 text-gray-700 border-b pb-2">ตั้งค่าระบบและข้อความวิ่ง</h3>
                <form id="settingsForm" class="space-y-4 mt-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ข้อความแถบด้านบน (Header)</label>
                        <input type="text" id="headerText" class="w-full px-4 py-2 border rounded-lg focus:ring-yellow-500 bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ข้อความแถบด้านล่าง (Footer)</label>
                        <input type="text" id="footerText" class="w-full px-4 py-2 border rounded-lg focus:ring-yellow-500 bg-gray-50">
                    </div>
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">เวลาสลับภาพ (วิ/รูป)</label>
                            <input type="number" id="slideDuration" min="3" max="3600" class="w-full px-4 py-2 border rounded-lg focus:ring-yellow-500 bg-gray-50" placeholder="10">
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-gray-700 mb-1">ความเร็วตัววิ่ง (วิ/รอบ)</label>
                            <input type="number" id="marqueeSpeed" min="5" max="100" class="w-full px-4 py-2 border rounded-lg focus:ring-yellow-500 bg-gray-50" placeholder="20">
                        </div>
                    </div>
                    <button type="submit" id="saveSettingBtn" class="w-full bg-yellow-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-yellow-600 transition shadow">บันทึกการตั้งค่า</button>
                </form>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow p-6">
            <h3 class="text-xl font-semibold mb-4 text-gray-700 border-b pb-2">รายการรูปภาพทั้งหมด</h3>
            <div class="overflow-x-auto mt-4">
                <table id="myTable" class="display w-full text-left border-collapse">
                    <thead>
                        <tr>
                            <th class="border-b p-3 bg-gray-50">ภาพตัวอย่าง</th>
                            <th class="border-b p-3 bg-gray-50">ตำแหน่ง</th>
                            <th class="border-b p-3 bg-gray-50">ชื่อไฟล์</th>
                            <th class="border-b p-3 bg-gray-50 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // *** ใส่ Web App URL ของคุณตรงนี้ ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzg1slFWJbXcdWV6VuQHd4nj5khVvjPWpqXC920AdoUa3GQC7-uAvkUDcmPeNpdhnvp/exec';
        let dataTable;
        let idleTimer;
        
        function resetIdleTimer() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => logout(true), 30 * 60 * 1000);
            }
        }
        ['mousemove', 'keydown', 'scroll', 'click'].forEach(e => window.addEventListener(e, resetIdleTimer));

        if(sessionStorage.getItem('isLoggedIn') === 'true') showAdminDashboard();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            Swal.fire({ title: 'กำลังตรวจสอบ...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

            try {
                const res = await fetch(`${SCRIPT_URL}?action=login&user=${user}&pass=${pass}`);
                const data = await res.json();
                if (data.status === 'success') {
                    Swal.close();
                    sessionStorage.setItem('isLoggedIn', 'true');
                    showAdminDashboard();
                } else { Swal.fire('ข้อมูลไม่ถูกต้อง', 'Username หรือ Password ผิด!', 'error'); }
            } catch (error) { Swal.fire('ผิดพลาด', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', 'error'); }
        });

        function showAdminDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            resetIdleTimer();
            loadSettings(); 
            loadTableData(); 
        }

        function logout(isTimeout = false) {
            sessionStorage.removeItem('isLoggedIn');
            clearTimeout(idleTimer);
            if (isTimeout) {
                Swal.fire({ title: 'หมดเวลา', text: 'ไม่ได้ใช้งานนานเกินไป กรุณาล็อกอินใหม่', icon: 'warning' }).then(() => location.reload());
            } else { location.reload(); }
        }

        async function loadSettings() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getSettings`);
                const data = await res.json();
                if(data.status === 'success') {
                    document.getElementById('headerText').value = data.header;
                    document.getElementById('footerText').value = data.footer;
                    document.getElementById('slideDuration').value = data.duration;
                    document.getElementById('marqueeSpeed').value = data.marqueeSpeed;
                }
            } catch (error) {}
        }

        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveSettingBtn');
            const payload = {
                action: 'saveSettings',
                header: document.getElementById('headerText').value,
                footer: document.getElementById('footerText').value,
                duration: parseInt(document.getElementById('slideDuration').value) || 10,
                marqueeSpeed: parseInt(document.getElementById('marqueeSpeed').value) || 20
            };
            btn.disabled = true; btn.innerText = 'กำลังบันทึก...';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
                Swal.fire('บันทึกสำเร็จ!', 'อัปเดตระบบเรียบร้อยแล้ว', 'success');
            } catch (error) { Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกได้', 'error'); }
            btn.disabled = false; btn.innerText = 'บันทึกการตั้งค่า';
        });

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const files = document.getElementById('fileInput').files;
            if (files.length === 0) return;
            const target = document.getElementById('uploadTarget').value;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            Swal.fire({ title: 'กำลังอัปโหลด...', html: `ประมวลผล (0/${files.length})`, allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            let successCount = 0;
            for (let i = 0; i < files.length; i++) {
                Swal.getHtmlContainer().innerText = `กำลังส่งรูปที่ ${i + 1}/${files.length}`;
                try {
                    const base64Data = await fileToBase64(files[i]);
                    await fetch(SCRIPT_URL, {
                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ target: target, filename: files[i].name, mimeType: files[i].type, base64: base64Data })
                    });
                    successCount++;
                } catch (e) {}
            }
            btn.disabled = false;
            Swal.fire('สำเร็จ!', `เพิ่ม ${successCount} รูปเข้าสู่ระบบแล้ว`, 'success');
            document.getElementById('uploadForm').reset();
            setTimeout(loadTableData, 1500); 
        });

        async function loadTableData() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getImages`);
                const result = await res.json();
                if (result.status === 'success') {
                    if ($.fn.DataTable.isDataTable('#myTable')) $('#myTable').DataTable().destroy();
                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = '';
                    result.data.forEach(item => {
                        let thumbUrl = item.url;
                        if (!thumbUrl.includes('googleusercontent') && !thumbUrl.includes('lh3.google')) {
                            const idMatch = thumbUrl.match(/id=([a-zA-Z0-9_-]+)/);
                            if (idMatch) thumbUrl = `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w200`;
                        }
                        
                        let badge = item.type === 'left' 
                            ? `<span class="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs font-bold">ฝั่งซ้าย (ภาพนิ่ง)</span>`
                            : `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold">ฝั่งขวา (สไลด์)</span>`;

                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 border-b">
                                <td class="p-3"><img src="${thumbUrl}" class="h-16 w-24 object-cover rounded shadow"></td>
                                <td class="p-3">${badge}</td>
                                <td class="p-3 text-sm">${item.filename}<br><span class="text-xs text-gray-500">${item.date}</span></td>
                                <td class="p-3 text-center"><button onclick="deleteRow(${item.row}, '${item.type}')" class="bg-red-100 text-red-600 px-3 py-1 rounded hover:bg-red-200 transition text-sm font-semibold">ลบ</button></td>
                            </tr>
                        `;
                    });
                    dataTable = $('#myTable').DataTable({ language: { lengthMenu: "หน้าละ _MENU_ รายการ", zeroRecords: "ไม่พบข้อมูล", info: "หน้า _PAGE_ / _PAGES_", search: "ค้นหา:", paginate: { first: "แรก", last: "สุดท้าย", next: "ถัดไป", previous: "ก่อนหน้า" } }, pageLength: 5, lengthMenu: [5, 10, 25, 50], ordering: false });
                }
            } catch (error) {}
        }

        async function deleteRow(rowIndex, type) {
            const result = await Swal.fire({ title: 'ยืนยันการลบ?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626', confirmButtonText: 'ใช่, ลบเลย!', cancelButtonText: 'ยกเลิก' });
            if (result.isConfirmed) {
                Swal.fire({ title: 'กำลังลบ...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
                try {
                    await fetch(`${SCRIPT_URL}?action=delete&row=${rowIndex}&type=${type}`);
                    Swal.fire('ลบสำเร็จ!', 'ข้อมูลถูกลบแล้ว', 'success');
                    loadTableData();
                } catch (error) { Swal.fire('ผิดพลาด', 'ไม่สามารถลบได้', 'error'); }
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
