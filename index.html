<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow Display</title>
    <link rel="icon" href="data:,">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
        }
        .slide {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .slide.active { opacity: 1; }
        .loader {
            color: #fff; font-family: sans-serif; text-align: center;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 1.2rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="loader" class="loader">กำลังโหลดรูปล่าสุดจากระบบ...</div>
    <div id="slideshow-container"></div>

    <script>
        // SCRIPT_URL ล่าสุดของคุณ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzg1slFWJbXcdWV6VuQHd4nj5khVvjPWpqXC920AdoUa3GQC7-uAvkUDcmPeNpdhnvp/exec';
        let images = [];
        let currentIndex = 0;

        async function fetchImages() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                // ถ้าระบบส่ง Error มา (กรณีตั้งสิทธิ์ Sheet ผิด)
                if (data.status === 'error' || data.error) {
                    document.getElementById('loader').innerHTML = `เกิดข้อผิดพลาดจากฝั่ง Google:<br><span style="color:#ff6b6b; font-size:1rem;">${data.message || data.error}</span>`;
                    return;
                }

                images = data;
                
                if (images && images.length > 0) {
                    document.getElementById('loader').style.display = 'none';
                    initSlideshow();
                } else {
                    document.getElementById('loader').innerText = 'ไม่พบรูปภาพใน Google Sheets (กรุณาอัปโหลดใหม่)';
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('loader').innerHTML = `ดึงข้อมูลจากระบบไม่สำเร็จ<br><span style="font-size: 0.9rem; color:#ff6b6b;">${error.toString()}</span><br><br><span style="font-size: 0.9rem; color:#aaa;">(ลองกดรีเฟรชหน้าเว็บอีกครั้ง)</span>`;
            }
        }

        function initSlideshow() {
            const container = document.getElementById('slideshow-container');
            container.innerHTML = '';
            
            images.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'slide' + (index === 0 ? ' active' : '');
                div.style.backgroundImage = `url('${url}')`;
                container.appendChild(div);
            });

            const slides = document.querySelectorAll('.slide');
            if(slides.length <= 1) return; 
            
            // สลับรูปภาพทุกๆ 10 วินาที
            setInterval(() => {
                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % slides.length;
                slides[currentIndex].classList.add('active');
            }, 10000); 
        }

        fetchImages();
    </script>
</body>
</html>
