<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow Display</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
        }
        .slide {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .slide.active { opacity: 1; }
        .loader {
            color: #fff; font-family: sans-serif;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="loader" class="loader">กำลังโหลดรูปภาพ...</div>
    <div id="slideshow-container"></div>

    <script>
        // *** นำ Web App URL ของ Apps Script มาใส่ตรงนี้ ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFe07XLlHPDIWFQGPO32TLsP3WLq8YA1qECyey3SuDU3mnKf2Y6I4beDCrQc1ON1bH/exec';
        let images = [];
        let currentIndex = 0;

        async function fetchImages() {
            try {
                const response = await fetch(SCRIPT_URL);
                images = await response.json();
                
                if(images.length > 0) {
                    document.getElementById('loader').style.display = 'none';
                    initSlideshow();
                } else {
                    document.getElementById('loader').innerText = 'ไม่พบรูปภาพในระบบ';
                }
            } catch (error) {
                document.getElementById('loader').innerText = 'เกิดข้อผิดพลาดในการโหลดข้อมูล';
            }
        }

        function initSlideshow() {
            const container = document.getElementById('slideshow-container');
            container.innerHTML = '';
            
            // สร้าง Element สำหรับรูปภาพทั้งหมด
            images.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'slide' + (index === 0 ? ' active' : '');
                div.style.backgroundImage = `url('${url}')`;
                container.appendChild(div);
            });

            const slides = document.querySelectorAll('.slide');
            
            // สลับรูปภาพทุกๆ 10 วินาที (10000 ms)
            setInterval(() => {
                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % slides.length;
                slides[currentIndex].classList.add('active');
            }, 10000);
        }

        fetchImages();
    </script>
</body>
</html>
