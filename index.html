<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow Display</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
        }
        .slide {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .slide.active { opacity: 1; }
        .loader {
            color: #fff; font-family: sans-serif; text-align: center;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div id="loader" class="loader">กำลังตรวจสอบและโหลดรูปภาพจากระบบ...</div>
    <div id="slideshow-container"></div>

    <script>
        // *** ใส่ Web App URL ตัวล่าสุดของคุณที่ได้จากการ Deploy ข้อแรกแทนที่ตรงนี้ ***
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzg1slFWJbXcdWV6VuQHd4nj5khVvjPWpqXC920AdoUa3GQC7-uAvkUDcmPeNpdhnvp/exec';
        let images = [];
        let currentIndex = 0;

        async function fetchImages() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                // ตรวจสอบว่าข้อมูลส่งกลับมาเป็น Error หรือไม่
                if (data.status === 'error' || data.error) {
                    document.getElementById('loader').innerHTML = `เกิดข้อผิดพลาดจาก Google Script:<br><span style="color:red;">${data.message || data.error}</span>`;
                    return;
                }

                images = data;
                
                if (images && images.length > 0) {
                    document.getElementById('loader').style.display = 'none';
                    initSlideshow();
                } else {
                    document.getElementById('loader').innerText = 'ไม่พบลิงก์รูปภาพใน Google Sheets (กรุณาลองอัปโหลดรูปภาพผ่านหน้า Admin ก่อน)';
                }
            } catch (error) {
                document.getElementById('loader').innerHTML = `เชื่อมต่อกับเซิร์ฟเวอร์ไม่สำเร็จ (CORS / URL ผิดพลาด)<br><span style="color:red;">${error.toString()}</span>`;
            }
        }

        function initSlideshow() {
            const container = document.getElementById('slideshow-container');
            container.innerHTML = '';
            
            images.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'slide' + (index === 0 ? ' active' : '');
                div.style.backgroundImage = `url('${url}')`;
                container.appendChild(div);
            });

            const slides = document.querySelectorAll('.slide');
            if(slides.length <= 1) return; // มีรูปเดียวไม่ต้องสลับสไลด์
            
            setInterval(() => {
                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % slides.length;
                slides[currentIndex].classList.add('active');
            }, 10000); // แสดงสไลด์ละ 10 วินาที
        }

        fetchImages();
    </script>
</body>
</html>
