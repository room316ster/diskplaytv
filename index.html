<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow Display</title>
    <link rel="icon" href="data:,">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
        }
        .slide {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: flex; justify-content: center; align-items: center;
        }
        .slide.active { opacity: 1; z-index: 10; }
        
        /* บังคับรูปภาพให้พอดีหน้าจอ */
        .slide img {
            max-width: 100%; max-height: 100%;
            object-fit: contain; 
        }

        .loader {
            color: #fff; font-family: sans-serif; text-align: center;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 1.2rem;
            line-height: 1.6; z-index: 99;
        }
    </style>
</head>
<body>

    <div id="loader" class="loader">กำลังโหลดรูปล่าสุดจากระบบ...</div>
    <div id="slideshow-container"></div>

    <script>
        // SCRIPT_URL ล่าสุดของคุณ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzg1slFWJbXcdWV6VuQHd4nj5khVvjPWpqXC920AdoUa3GQC7-uAvkUDcmPeNpdhnvp/exec';
        let images = [];
        let currentIndex = 0;

        async function fetchImages() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if (data.status === 'error' || data.error) {
                    document.getElementById('loader').innerHTML = `เกิดข้อผิดพลาดจากฝั่ง Google:<br><span style="color:#ff6b6b; font-size:1rem;">${data.message || data.error}</span>`;
                    return;
                }

                images = data;
                
                if (images && images.length > 0) {
                    document.getElementById('loader').style.display = 'none';
                    initSlideshow();
                } else {
                    document.getElementById('loader').innerText = 'ไม่พบรูปภาพใน Google Sheets (กรุณาอัปโหลดใหม่)';
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                
                // ใช้แผนสำรองในกรณีที่ติดปัญหา CORS บนเบราว์เซอร์
                try {
                    const res = await fetch(SCRIPT_URL + '?action=get');
                    images = await res.json();
                    if(images.length > 0) {
                        document.getElementById('loader').style.display = 'none';
                        initSlideshow();
                    }
                } catch(e) {
                     document.getElementById('loader').innerHTML = `ดึงข้อมูลจากระบบไม่สำเร็จ<br><span style="font-size: 0.9rem; color:#ff6b6b;">หากหน้าจอค้างหน้านี้ ลองเช็กอินเทอร์เน็ตหรือรีเฟรชอีกครั้ง</span>`;
                }
            }
        }

        function initSlideshow() {
            const container = document.getElementById('slideshow-container');
            container.innerHTML = '';
            
            // เปลี่ยนจากการใช้ Background-image มาเป็นแท็ก <img> เพื่อแก้ปัญหาจอดำ
            images.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'slide' + (index === 0 ? ' active' : '');
                
                const img = document.createElement('img');
                img.src = url;
                // ป้องกันรูปภาพโหลดไม่ขึ้นหรือโดนบล็อก
                img.onerror = function() {
                    console.log("ไม่สามารถโหลดรูปนี้ได้:", url);
                };
                
                div.appendChild(img);
                container.appendChild(div);
            });

            const slides = document.querySelectorAll('.slide');
            if(slides.length <= 1) return; 
            
            // สลับรูปภาพทุกๆ 10 วินาที
            setInterval(() => {
                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % slides.length;
                slides[currentIndex].classList.add('active');
            }, 10000); 
        }

        fetchImages();
    </script>
</body>
</html>
