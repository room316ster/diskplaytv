<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow Display - Split Screen</title>
    <link rel="icon" href="data:,">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; font-family: sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
        }

        .marquee-container {
            width: 100%; background: #111827; color: #facc15; 
            padding: 12px 0; overflow: hidden; white-space: nowrap; z-index: 20;
            box-shadow: 0 0 15px rgba(0,0,0,0.8); font-size: 1.8rem; font-weight: bold;
        }
        .marquee-content {
            display: inline-block; padding-left: 100%;
            animation: marquee 20s linear infinite; 
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        #main-content-wrapper {
            flex: 1; display: flex; flex-direction: row; overflow: hidden; background-color: #000; position: relative;
        }

        #left-column {
            width: 30%; height: 100%; border-right: 4px solid #1f2937;
            display: flex; justify-content: center; align-items: center; overflow: hidden; background-color: #050505;
        }
        #left-column img { width: 100%; height: 100%; object-fit: contain; }

        #right-column {
            width: 70%; height: 100%; position: relative; overflow: hidden;
        }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.5s ease-in-out;
            display: flex; justify-content: center; align-items: center;
        }
        .slide.active { opacity: 1; z-index: 10; }
        .slide img { width: 100%; height: 100%; object-fit: contain; }

        #progress-container {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 6px; background: rgba(0,0,0,0.5); z-index: 20;
        }
        #progress-bar { height: 100%; width: 0%; background: #3b82f6; transition: none; }
        
        #hint {
            position: absolute; top: 20px; right: 20px;
            color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.5);
            padding: 8px 16px; border-radius: 20px; font-size: 0.9rem;
            z-index: 30; transition: opacity 2s; pointer-events: none;
        }
        .loader {
            color: #fff; text-align: center; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 1.2rem; z-index: 99;
        }
    </style>
</head>
<body>

    <div class="marquee-container border-b-4 border-yellow-500">
        <div id="header-text" class="marquee-content">กำลังโหลดข้อมูล...</div>
    </div>

    <div id="main-content-wrapper">
        <div id="loader" class="loader">กำลังโหลดรูปภาพ...</div>
        <div id="hint">ดับเบิลคลิกที่หน้าจอเพื่อเปิดเต็มจอ (Fullscreen)</div>
        
        <!-- รูปภาพฝั่งซ้าย (ดึงจากชีต 'รูปคอลัมน์ซ้าย') -->
        <div id="left-column">
            <img id="static-img" src="" style="display:none;" alt="ภาพหลัก">
        </div>
        
        <!-- รูปภาพฝั่งขวา (ดึงจากชีต 'รูปคอลัมน์ขวา') -->
        <div id="right-column">
            <div id="slideshow-container"></div>
            <div id="progress-container"><div id="progress-bar"></div></div>
        </div>
    </div>

    <div class="marquee-container border-t-4 border-yellow-500">
        <div id="footer-text" class="marquee-content">กำลังโหลดข้อมูล...</div>
    </div>

    <script>
        // *** ใส่ Web App URL ของคุณตรงนี้ ***
        const SCRIPT_URL = 'ใส่_URL_ล่าสุดที่นี่';
        const SYNC_INTERVAL = 5 * 60 * 1000; 

        let currentConfig = { imagesLeft: [], imagesRight: [], header: '', footer: '', duration: 10, marqueeSpeed: 20 };
        let currentIndex = 0;
        let slideInterval, progressTimeout;

        document.getElementById('main-content-wrapper').addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else { document.exitFullscreen(); }
        });

        setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 5000);

        function updateMarqueeSpeed(speedInSeconds) {
            document.querySelectorAll('.marquee-content').forEach(el => {
                el.style.animationDuration = `${speedInSeconds}s`;
            });
        }

        function getCleanUrl(url) {
            if (!url) return '';
            if (url.includes('googleusercontent.com') || url.includes('lh3.google')) return url;
            const idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
            return idMatch ? `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1920` : url;
        }

        async function fetchImages(isAutoSync = false) {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if (data.status === 'error' || data.error) return;

                const newDuration = parseInt(data.duration) || 10;
                const newMarqueeSpeed = parseInt(data.marqueeSpeed) || 20;

                if (JSON.stringify(currentConfig.imagesLeft) !== JSON.stringify(data.imagesLeft) ||
                    JSON.stringify(currentConfig.imagesRight) !== JSON.stringify(data.imagesRight) ||
                    currentConfig.header !== data.header || currentConfig.footer !== data.footer ||
                    currentConfig.duration !== newDuration || currentConfig.marqueeSpeed !== newMarqueeSpeed) {
                    
                    currentConfig = {
                        imagesLeft: data.imagesLeft, imagesRight: data.imagesRight, 
                        header: data.header, footer: data.footer,
                        duration: newDuration, marqueeSpeed: newMarqueeSpeed
                    };
                    
                    document.getElementById('header-text').innerText = data.header;
                    document.getElementById('footer-text').innerText = data.footer;
                    updateMarqueeSpeed(newMarqueeSpeed);
                    
                    document.getElementById('loader').style.display = 'none';

                    // 1. อัปเดตรูปฝั่งซ้าย (ดึงรูปที่อัปโหลดล่าสุดของฝั่งซ้ายมาใช้)
                    const leftImgElement = document.getElementById('static-img');
                    if (currentConfig.imagesLeft.length > 0) {
                        const latestLeftImg = currentConfig.imagesLeft[currentConfig.imagesLeft.length - 1];
                        leftImgElement.src = getCleanUrl(latestLeftImg);
                        leftImgElement.style.display = 'block';
                    } else {
                        leftImgElement.style.display = 'none';
                    }

                    // 2. อัปเดตรูปฝั่งขวา
                    if (currentConfig.imagesRight.length > 0) {
                        initSlideshow(currentConfig.imagesRight);
                    } else {
                        document.getElementById('slideshow-container').innerHTML = '<div class="slide active"><h2 style="color:white;">ไม่มีรูปภาพฝั่งขวา</h2></div>';
                        document.getElementById('progress-bar').style.width = '0%';
                        if(slideInterval) clearInterval(slideInterval);
                    }
                }
            } catch (error) {
                if(!isAutoSync) document.getElementById('loader').innerHTML = `กำลังเชื่อมต่อระบบ...`;
            }
        }

        function initSlideshow(slideImages) {
            const container = document.getElementById('slideshow-container');
            container.innerHTML = '';
            
            slideImages.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'slide' + (index === 0 ? ' active' : '');
                const img = document.createElement('img');
                img.src = getCleanUrl(url);
                div.appendChild(img);
                container.appendChild(div);
            });

            const slides = document.querySelectorAll('.slide');
            if(slideInterval) clearInterval(slideInterval);
            
            if(slides.length <= 1) {
                document.getElementById('progress-bar').style.width = '100%';
                return; 
            }
            
            currentIndex = 0;
            animateProgressBar();

            const msDuration = currentConfig.duration * 1000;
            slideInterval = setInterval(() => {
                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % slides.length;
                slides[currentIndex].classList.add('active');
                animateProgressBar();
            }, msDuration); 
        }

        function animateProgressBar() {
            const msDuration = currentConfig.duration * 1000;
            const bar = document.getElementById('progress-bar');
            bar.style.transition = 'none';
            bar.style.width = '0%';
            
            clearTimeout(progressTimeout);
            progressTimeout = setTimeout(() => {
                bar.style.transition = `width ${msDuration}ms linear`;
                bar.style.width = '100%';
            }, 50); 
        }

        fetchImages();
        setInterval(() => fetchImages(true), SYNC_INTERVAL);
    </script>
</body>
</html>
