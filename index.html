<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow Display</title>
    <link rel="icon" href="data:,">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; font-family: sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* ----- ระบบอักษรวิ่ง (Marquee) ----- */
        .marquee-container {
            width: 100%; background: #111827; color: #facc15; 
            padding: 12px 0; overflow: hidden; white-space: nowrap; z-index: 20;
            box-shadow: 0 0 15px rgba(0,0,0,0.8); font-size: 1.8rem; font-weight: bold;
        }
        .marquee-content {
            display: inline-block; padding-left: 100%;
            animation: marquee 20s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* ----- ส่วนของรูปภาพ ----- */
        #slideshow-wrapper {
            flex: 1; position: relative; overflow: hidden; background-color: #000;
        }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.5s ease-in-out;
            display: flex; justify-content: center; align-items: center;
        }
        .slide.active { opacity: 1; z-index: 10; }
        
        /* แก้ไขตรงนี้: เปลี่ยนจาก cover เป็น contain เพื่อให้อยู่ในกรอบ 100% */
        .slide img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }

        /* ----- แถบ Progress และ Hint ----- */
        #progress-container {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 6px; background: rgba(0,0,0,0.5); z-index: 20;
        }
        #progress-bar { height: 100%; width: 0%; background: #3b82f6; transition: none; }
        
        #hint {
            position: absolute; top: 20px; right: 20px;
            color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.5);
            padding: 8px 16px; border-radius: 20px; font-size: 0.9rem;
            z-index: 30; transition: opacity 2s; pointer-events: none;
        }
        .loader {
            color: #fff; text-align: center; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 1.2rem; z-index: 99;
        }
    </style>
</head>
<body>

    <!-- Header Marquee -->
    <div class="marquee-container border-b-4 border-yellow-500">
        <div id="header-text" class="marquee-content">กำลังโหลดข้อมูล...</div>
    </div>

    <div id="slideshow-wrapper">
        <div id="loader" class="loader">กำลังโหลดรูปภาพ...</div>
        <div id="hint">ดับเบิลคลิกที่หน้าจอเพื่อเปิดเต็มจอ (Fullscreen)</div>
        <div id="slideshow-container"></div>
        <div id="progress-container"><div id="progress-bar"></div></div>
    </div>

    <!-- Footer Marquee -->
    <div class="marquee-container border-t-4 border-yellow-500">
        <div id="footer-text" class="marquee-content">กำลังโหลดข้อมูล...</div>
    </div>

    <script>
        // *** อย่าลืมใส่ Web App URL ล่าสุดของคุณตรงนี้ ***
        const SCRIPT_URL = 'ใส่_URL_ล่าสุดที่นี่';
        const SLIDE_DURATION = 10000; 
        const SYNC_INTERVAL = 5 * 60 * 1000; 

        let currentConfig = { images: [], header: '', footer: '' };
        let currentIndex = 0;
        let slideInterval, progressTimeout;

        document.getElementById('slideshow-wrapper').addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        });

        setTimeout(() => { document.getElementById('hint').style.opacity = '0'; }, 5000);

        async function fetchImages(isAutoSync = false) {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if (data.status === 'error' || data.error) return;

                if (JSON.stringify(currentConfig.images) !== JSON.stringify(data.images) ||
                    currentConfig.header !== data.header || currentConfig.footer !== data.footer) {
                    
                    currentConfig = data;
                    
                    document.getElementById('header-text').innerText = data.header;
                    document.getElementById('footer-text').innerText = data.footer;

                    if (currentConfig.images.length > 0) {
                        document.getElementById('loader').style.display = 'none';
                        initSlideshow();
                    }
                }
            } catch (error) {
                if(!isAutoSync) document.getElementById('loader').innerHTML = `กำลังเชื่อมต่อระบบ...`;
            }
        }

        function initSlideshow() {
            const container = document.getElementById('slideshow-container');
            container.innerHTML = '';
            
            currentConfig.images.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'slide' + (index === 0 ? ' active' : '');
                
                const img = document.createElement('img');
                let finalUrl = url;
                if (!url.includes('googleusercontent.com') && !url.includes('lh3.google')) {
                    const idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
                    if (idMatch) finalUrl = `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1920`;
                }
                img.src = finalUrl;
                
                div.appendChild(img);
                container.appendChild(div);
            });

            const slides = document.querySelectorAll('.slide');
            if(slideInterval) clearInterval(slideInterval);
            
            if(slides.length <= 1) {
                document.getElementById('progress-bar').style.width = '100%';
                return; 
            }
            
            currentIndex = 0;
            animateProgressBar();

            slideInterval = setInterval(() => {
                slides[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % slides.length;
                slides[currentIndex].classList.add('active');
                animateProgressBar();
            }, SLIDE_DURATION); 
        }

        function animateProgressBar() {
            const bar = document.getElementById('progress-bar');
            bar.style.transition = 'none';
            bar.style.width = '0%';
            
            clearTimeout(progressTimeout);
            progressTimeout = setTimeout(() => {
                bar.style.transition = `width ${SLIDE_DURATION}ms linear`;
                bar.style.width = '100%';
            }, 50); 
        }

        fetchImages();
        setInterval(() => fetchImages(true), SYNC_INTERVAL);
    </script>
</body>
</html>
